[project]
name = "kalshi-bot"
version = "0.1.0"
description = "Algorithmic trading system for the Kalshi prediction market"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pandas>=2.2",
    "numpy>=1.26",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kalshi_bot*"]
