
name: Clayve Kalshi Bot - Safe Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TRADING_MODE: paper
      LIVE_TRADING_ACK: "no"
      MAX_POSITION_PER_MARKET: "2"
      MAX_TOTAL_EXPOSURE: "10"
      MAX_DAILY_LOSS: "5"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Confirm safe test mode
        run: |
          echo "Tests completed."
          echo "Trading mode: paper"
          echo "No trading engine started."
          echo "No real orders submitted."
